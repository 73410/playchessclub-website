# Replace example.com with your domain before enabling this site.
# This file belongs inside nginx's http {} context (usually /etc/nginx/conf.d/).
server {
    listen 80;
    server_name example.com;

    root /var/www/playchessclub;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Asset filenames are stable across releases, so revalidate cached copies.
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml model/gltf-binary;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.glb$ {
        default_type model/gltf-binary;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
